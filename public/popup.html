<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="appTitle">PoE2 Merchant History</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="item-detail.css" />
  </head>
  <body>
    <div class="film-app">
      <aside class="film-nav">
        <a class="brand" href="popup.html">PoE2 <span>Merchant History</span></a>
        <nav aria-label="Main navigation" data-i18n-aria-label="mainNavigation">
          <a href="popup.html" data-i18n="tableTitle" aria-current="page">Sales history</a>
          <a href="purchase-history.html" data-i18n="purchaseHistoryTitle">Purchase History</a>
          <a href="options.html" data-i18n="settingsTitle">Settings</a>
        </nav>
      </aside>

      <main class="sales-workspace">
        <header class="bench-header">
          <div class="title-block">
            <h1 data-i18n="tableTitle">Sales history</h1>
          </div>

          <section class="controls" aria-label="Workspace controls">
            <label>
              <span data-i18n="labelLeague">リーグ</span>
              <select id="league-select"></select>
            </label>
            <label>
              <span data-i18n="labelLanguage">言語</span>
              <select id="language-select">
                <option value="en" data-i18n="languageEnglish">English</option>
                <option value="ja" data-i18n="languageJapanese">日本語</option>
              </select>
            </label>
            <button id="refresh-btn" data-i18n="buttonRefresh">更新</button>
            <p id="sales-status" class="page-feedback" role="status" aria-live="polite"></p>
          </section>
        </header>

        <section id="sales-chart-section" class="film-rail-section chart-section" hidden>
          <header class="film-rail-header">
            <h2 id="chart-title" data-i18n="salesRailTitle">日別販売</h2>
          </header>
          <div
            id="sales-chart"
            class="film-frames"
            role="group"
            aria-labelledby="chart-title"
          ></div>
          <button id="show-all-dates" class="secondary-action" data-i18n="salesAllDates">
            全期間
          </button>
          <details class="chart-data-details">
            <summary id="chart-data-label" data-i18n="chartData">Daily totals as a table</summary>
            <table>
              <thead>
                <tr>
                  <th scope="col" data-i18n="tableHeaderDate">Date</th>
                  <th scope="col" data-i18n="tableHeaderCurrency">Currency</th>
                  <th scope="col" data-i18n="tableHeaderAmount">Amount</th>
                </tr>
              </thead>
              <tbody id="chart-data"></tbody>
            </table>
          </details>
        </section>

        <div class="bench-lower">
          <section class="purchase-summary">
            <header>
              <h2 data-i18n="purchasePendingTitle">Pending purchases</h2>
              <p>
                <strong id="purchase-pending-count">0</strong>
                <span data-i18n="purchasePendingUnit">items</span>
              </p>
            </header>
            <p id="purchase-pending-error" role="status" hidden></p>
            <ul id="purchase-pending-list"></ul>
            <a
              id="open-purchase-history"
              class="button-link"
              href="purchase-history.html"
              data-i18n="purchaseOpenHistory"
              >Open purchase history</a
            >
          </section>

          <section class="table-section">
            <div class="table-header">
              <div>
                <h2 id="sales-history-title" data-i18n="tableTitle">販売履歴</h2>
                <p id="selected-date-label" aria-live="polite"></p>
              </div>
              <div class="table-controls">
                <label class="search-control">
                  <span data-i18n="searchLabel">アイテム名を検索</span>
                  <input
                    id="search-input"
                    type="search"
                    placeholder="アイテム名で検索"
                    data-i18n-placeholder="searchPlaceholder"
                  />
                </label>
                <label class="page-size-control">
                  <span data-i18n="pageSizeLabel">1ページの表示件数</span>
                  <select id="page-size">
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                  </select>
                </label>
                <button id="csv-export" data-i18n="buttonCsv">CSV出力</button>
              </div>
            </div>
            <div class="table-wrapper">
              <table aria-labelledby="sales-history-title">
                <thead>
                  <tr>
                    <th scope="col" data-i18n="tableHeaderDate">日時</th>
                    <th scope="col" data-i18n="tableHeaderItem">アイテム名</th>
                    <th scope="col" data-i18n="tableHeaderCurrency">通貨</th>
                    <th scope="col" data-i18n="tableHeaderAmount">個数</th>
                  </tr>
                </thead>
                <tbody id="history-body"></tbody>
              </table>
            </div>
            <div class="pagination">
              <button id="prev-page" data-i18n="buttonPrev">前へ</button>
              <span id="page-info"></span>
              <button id="next-page" data-i18n="buttonNext">次へ</button>
            </div>
          </section>

          <aside id="day-summary" class="day-summary" aria-live="polite"></aside>
        </div>
      </main>
    </div>

    <dialog
      id="modal"
      class="notice-dialog"
      aria-labelledby="modal-title"
      aria-describedby="modal-message"
    >
      <div class="modal-content">
        <h2 id="modal-title"></h2>
        <p id="modal-message"></p>
        <button id="modal-close" data-i18n="modalClose">閉じる</button>
      </div>
    </dialog>

    <dialog id="detail-modal" class="modal hidden" aria-labelledby="detail-title">
      <div class="modal-content modal-tooltip">
        <article id="detail-card" class="item-tooltip" data-rarity="normal">
          <button
            id="detail-close"
            class="detail-close"
            type="button"
            data-i18n-aria-label="detailClose"
          >
            <span aria-hidden="true">×</span>
            <span data-i18n="detailClose">Close</span>
          </button>
          <header class="item-tooltip-header">
            <h2 id="detail-title"></h2>
            <p id="detail-subtitle"></p>
          </header>
          <div id="detail-body" class="detail-body"></div>
        </article>
      </div>
    </dialog>

    <script type="module" src="popup.js"></script>
  </body>
</html>
