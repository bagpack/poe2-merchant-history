<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="cookieTitle">Cookie状態</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="options">
      <header>
        <h1 data-i18n="cookieTitle">Cookie状態</h1>
        <p data-i18n="cookieDesc">PoE2の履歴取得に必要なCookieを確認します。</p>
      </header>

      <section class="card">
        <div id="cookie-list"></div>
        <button id="refresh-cookies" data-i18n="cookieButtonRefresh">再取得</button>
      </section>

      <section class="card">
        <h2 data-i18n="backupTitle">バックアップ / 復元</h2>
        <p data-i18n="backupDesc">
          拡張ID変更時に備えて storage と IndexedDB をエクスポート/インポートします。
        </p>
        <div class="actions">
          <button id="export-backup" data-i18n="backupExport">バックアップ出力</button>
          <button id="import-backup" data-i18n="backupImport">バックアップ読込</button>
        </div>
        <p id="backup-status" class="backup-status"></p>
      </section>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
